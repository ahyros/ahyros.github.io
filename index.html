<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kandidát na starostu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
    }

    /* ── BANNER ── */
    .banner {
      width: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #ffffff;
      padding: 80px 40px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .banner h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .banner p {
      font-size: 1.2rem;
      color: #a8d8ea;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── MAIN CONTENT ── */
    .content {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
      color: #333;
    }

    .content h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .content p {
      font-size: 1rem;
      line-height: 1.7;
      color: #555;
    }

    /* ── PHOTO ── */
    .content img {
      display: block;
      margin: 30px auto 20px;
      max-width: 100%;
      width: 360px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <img src="poster.jpg" alt="Poster" />
</body>
</html>
