<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
    }

    /* ── BANNER ── */
    .banner {
      width: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #ffffff;
      padding: 80px 40px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .banner h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .banner p {
      font-size: 1.2rem;
      color: #a8d8ea;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── MAIN CONTENT ── */
    .content {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
      color: #333;
    }

    .content h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .content p {
      font-size: 1rem;
      line-height: 1.7;
      color: #555;
    }

    /* ── PHOTO ── */
    .content img {
      display: block;
      margin: 30px auto 20px;
      max-width: 100%;
      width: 360px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <!-- Banner at the top of the page -->
  <header class="banner">
    <h1>Hello, I'm Džesy, woof!</h1>
    <p>Welcome to my personal webpage!</p>
  </header>

  <!-- Some content below the banner -->
  <main class="content">
    <h2>About Me</h2>
    <!-- Replace photo.jpg with your own image filename. Put the image file in the same folder as index.html. -->
    <img src="dz.jpg" alt="My photo" />
    <p>
        Visit my <a href="https://www.koliaklub.sk/profil-psa/gessi-canis-ab-istropolitana/">professional web page</a>!

    </p>
  </main>

</body>
</html>
